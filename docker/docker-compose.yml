services:
  foxglove_bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: foxglove_bridge
    # network_mode: host is not used to allow port mapping for the WebSocket server
    # however since in windows and macOS docker runs in a VM, network_mode: host is not supported 
    # so we use default port mapping that works across all platforms.
    # network_mode: host          
    ipc: host                   
    environment:
      - ROS_DOMAIN_ID=0
      - RCUTILS_LOGGING_MIN_SEVERITY=INFO
      - FREQUENCY=${FREQUENCY}
      - NUM_TOPICS=${NUM_TOPICS}
    ports:
      - "8765:8765"             
