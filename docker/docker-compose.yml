version: "3.9"

services:
  foxglove_bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: foxglove_bridge
    network_mode: host          # required for ROS 2 DDS discovery
    ipc: host                   # shared memory transport (zero-copy at high Hz)
    environment:
      - ROS_DOMAIN_ID=0
      - RCUTILS_LOGGING_MIN_SEVERITY=INFO
      - FREQUENCY=${FREQUENCY}
    ports:
      - "8765:8765"             # Foxglove Studio WebSocket
    restart: unless-stopped
